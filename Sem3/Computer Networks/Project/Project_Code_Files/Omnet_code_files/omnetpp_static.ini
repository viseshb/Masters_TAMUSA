[General]
network = simulations.OmnetNetwork
sim-time-limit = 20s

ned-path = .;../inet/src;../inet/examples;../inet/showcases
load-libs = ../inet/out/gcc-release/src/INET

description = "Static routed connectivity test with auto IPs + auto routes"

*.visualizer.*.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.*.routingTableVisualizer.displayRoutingTables = true
*.visualizer.*.packetDropVisualizer.displayPacketDrops = true
*.visualizer.*.infoVisualizer.displayInfos = true
*.visualizer.*.dataLinkVisualizer.displayLinks = true

record-eventlog = true
output-vector-file = results/output.vec
output-scalar-file = results/output.sca
**.recordStatistics = true
**.udp.recordData = true
**.tcp.recordData = true
**.throughput.result-recording-modes = all
**.delay.result-recording-modes = all

# configurator: give each link its own /24, give hosts default routes via the router,
# and install static routes across that router
*.configurator.assignAddresses = true
*.configurator.assignDisjunctSubnetAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addSubnetRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.optimizeRoutes = false

# node2 is the transit router
*.node2.ipv4.forwarding = true

# apps
*.node3.numApps = 1
*.node3.app[0].typename = "UdpSink"
*.node3.app[0].localPort = 9000

*.node1.numApps = 1
*.node1.app[0].typename = "UdpBasicApp"
*.node1.app[0].startTime = 1s
*.node1.app[0].sendInterval = 1s
*.node1.app[0].messageLength = 1024B
*.node1.app[0].localPort = 9000
*.node1.app[0].destPort = 9000
*.node1.app[0].destAddresses = "node3"

*.node2.numApps = 0
