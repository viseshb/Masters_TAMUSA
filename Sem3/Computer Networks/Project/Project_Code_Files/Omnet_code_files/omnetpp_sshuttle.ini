[General]
network = simulations.OmnetNetwork
sim-time-limit = 20s

ned-path = .;../inet/src;../inet/examples;../inet/showcases
load-libs = ../inet/out/gcc-release/src/INET

description = "sshuttle-style TCP forwarding: node1 TCP client -> node3 TCP sink, node2 in the middle acting like a forwarding box"

# --- Visualization / recording (optional but nice for screenshots) ---
*.visualizer.*.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.*.routingTableVisualizer.displayRoutingTables = true
*.visualizer.*.packetDropVisualizer.displayPacketDrops = true
*.visualizer.*.infoVisualizer.displayInfos = true
*.visualizer.*.dataLinkVisualizer.displayLinks = true

record-eventlog = true
output-vector-file = results/output.vec
output-scalar-file = results/output.sca
**.recordStatistics = true
**.tcp.recordData = true
**.throughput.result-recording-modes = all
**.delay.result-recording-modes = all

# --- IPv4 configurator / routing ---
# We ask the configurator to:
#   - auto-assign per-link /24 subnets
#   - install static + default routes
#   - treat node2 as the router
*.configurator.assignAddresses = true
*.configurator.assignDisjunctSubnetAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addSubnetRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.optimizeRoutes = false

# node2 is our "gateway"/"sshuttle relay"
*.node2.ipv4.forwarding = true

# --- TCP apps ---
# node3: TCP sink (like sshuttle target service)
*.node3.numApps = 1
*.node3.app[0].typename = "TcpSinkApp"
*.node3.app[0].localPort = 5000

# node1: TCP client that connects across node2 to node3
*.node1.numApps = 1
*.node1.app[0].typename = "TcpBasicClientApp"
*.node1.app[0].connectAddress = "node3"   # resolved via L3AddressResolver
*.node1.app[0].connectPort = 5000
*.node1.app[0].tOpen = 1s
*.node1.app[0].tSend = 2s
*.node1.app[0].tClose = 10s
*.node1.app[0].sendBytes = 1MiB

# node2: no end-host app, it just forwards like an sshuttle middlebox
*.node2.numApps = 0
