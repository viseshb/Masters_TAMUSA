[General]
network = simulations.OmnetNetwork
sim-time-limit = 20s

ned-path = .;../inet/src;../inet/examples;../inet/showcases
load-libs = ../inet/out/gcc-release/src/INET

description = "Two subnets (10.0.0.0/24 <-> 10.0.1.0/24) connected by node2 as router. node1 sends UDP to node3."

############################
# Visualization / stats
############################
*.visualizer.*.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.*.routingTableVisualizer.displayRoutingTables = true
*.visualizer.*.packetDropVisualizer.displayPacketDrops = true
*.visualizer.*.infoVisualizer.displayInfos = true
*.visualizer.*.dataLinkVisualizer.displayLinks = true

record-eventlog = true
output-vector-file = results/output.vec
output-scalar-file = results/output.sca
**.recordStatistics = true
**.udp.recordData = true
**.throughput.result-recording-modes = all
**.delay.result-recording-modes = all

############################
# Turn OFF configurator magic
# (we only keep it as a module in the NED so OMNeT++ doesn't complain,
#  but we won't let it touch addresses or routes)
############################
*.configurator.assignAddresses = false
*.configurator.addStaticRoutes = false
*.configurator.addSubnetRoutes = false
*.configurator.addDefaultRoutes = false
*.configurator.optimizeRoutes = false

############################
# Manual IP addressing
#
# subnet A: node1 <-> node2.eth[0]
#   10.0.0.0/24
#
# subnet B: node2.eth[1] <-> node3
#   10.0.1.0/24
############################

*.node1.ipv4.config = "manual"
*.node1.eth[0].ipv4.address = "10.0.0.1"
*.node1.eth[0].ipv4.netmask = "255.255.255.0"

*.node2.ipv4.config = "manual"
*.node2.eth[0].ipv4.address = "10.0.0.2"
*.node2.eth[0].ipv4.netmask = "255.255.255.0"
*.node2.eth[1].ipv4.address = "10.0.1.1"
*.node2.eth[1].ipv4.netmask = "255.255.255.0"
*.node2.ipv4.forwarding = true    # crucial: behave like a router

*.node3.ipv4.config = "manual"
*.node3.eth[0].ipv4.address = "10.0.1.2"
*.node3.eth[0].ipv4.netmask = "255.255.255.0"

############################
# Static routes (manual)
#
# node1: to reach 10.0.1.0/24, send to gateway 10.0.0.2 via eth0
# node3: to reach 10.0.0.0/24, send to gateway 10.0.1.1 via eth0
#
# NOTE: This is the important part that prevents the ARP crash.
############################

*.node1.ipv4.routingTable.routes = [{ destination = "10.0.1.0"; netmask = "255.255.255.0"; gateway = "10.0.0.2"; interface = "eth0"; }]

*.node3.ipv4.routingTable.routes = [{ destination = "10.0.0.0"; netmask = "255.255.255.0"; gateway = "10.0.1.1"; interface = "eth0"; }]

# node2 doesn't need extra routes because it's directly on both subnets.

############################
# UDP apps
#
# node1: UdpBasicApp sends to node3:9000
# node3: UdpSink listens on 9000
############################

*.node1.numApps = 1
*.node1.app[0].typename = "UdpBasicApp"
*.node1.app[0].localPort = 9000
*.node1.app[0].destPort = 9000
*.node1.app[0].destAddresses = "10.0.1.2"
*.node1.app[0].startTime = 1s
*.node1.app[0].sendInterval = 1s
*.node1.app[0].messageLength = 1024B

*.node2.numApps = 0

*.node3.numApps = 1
*.node3.app[0].typename = "UdpSink"
*.node3.app[0].localPort = 9000
